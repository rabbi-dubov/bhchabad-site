<style type="text/css">
html.cc-hold body { opacity: 0 !important; }
html.cc-hold.cc-css body { opacity: 1 !important; }
html.cc-hold.cc-home-wait.cc-css body { opacity: 0 !important; }
html.cc-hold.cc-home-wait.cc-css.cc-shell-ready body, html.cc-hold.cc-shell-failed body { opacity: 1 !important; }

<script type="text/javascript">//<![CDATA[
(function () {
  var m = /[?&]cc=(test|off|live)\b/.exec(location.search), mode = "live";
  try { if (m) { localStorage.setItem("cc-mode", m[1]); } mode = localStorage.getItem("cc-mode") || "live"; } catch (e) {}
  window.ccMode = mode;
  if (mode === "off") { return; }
  // LIVE = the exact release the site runs (a commit id of the repo). jsDelivr serves an exact commit at once and never
  // mixes versions; "@main" lagged for hours and handed out a new script with an old stylesheet (Nov 27, 2026).
  // EVERY RELEASE: put the new release commit's full id here, then Save, Preview, Publish. See SKILL.md, "Release".
  var LIVE = "f7a4e3ee01ac85695f9ba04de6ef45840de0ac82";
  var test = mode === "test";
  var base = "https://cdn.jsdelivr.net/gh/rabbi-dubov/bhchabad-site@" + (test ? "main/test/" : LIVE + "/live/");
  window.ccBase = base;
  // test files change under one address, so they get an hourly key; a release's files never change, so they need none
  window.ccV = test ? "?v=" + Math.floor(Date.now() / 3600000) : "";
  var h = document.documentElement, home = location.pathname === "/" || /default\.asp$/i.test(location.pathname);
  // the look: the new one for everyone; "?look=now" brings the previous look back for this browser, "?look=next" undoes that
  // (theme.js reads the same setting and has the last word)
  var look = "next";
  try { var lm = /[?&]look=(next|now)\b/.exec(location.search); if (lm) { localStorage.setItem("cc-look", lm[1]); } look = localStorage.getItem("cc-look") || "next"; } catch (e) {}
  h.className += " cc-on cc-hold" + (look === "next" ? " cc-v2" : "") + (home ? " cc-home-wait" : "");
  function release() { h.className = h.className.replace(/\bcc-hold\b/g, ""); }
  var l = document.createElement("link"); l.rel = "stylesheet"; l.href = base + "theme.min.css" + window.ccV;
  l.onload = function () { h.className += " cc-css"; };
  l.onerror = function () { h.className = h.className.replace(/\bcc-on\b/, ""); release(); };
  document.head.appendChild(l);
  // start downloading the theme script now; the footer loader runs it from the browser cache
  var p = document.createElement("link"); p.rel = "preload"; p.as = "script"; p.href = base + "theme.min.js" + window.ccV;
  document.head.appendChild(p);

  }
  setTimeout(release, 4000);   // never leave a visitor looking at a blank page
})();
