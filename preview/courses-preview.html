html body.cco_body .cc-photos li a, html body.cco_body .cc-photos li img { display: block; width: 100% !important; aspect-ratio: 1 / 1; height: auto !important; border-radius: var(--cc-radius-sm); background-size: cover !important; background-position: center !important; }
html body.cco_body .cc-photos .widget_header { display: none; }
html body.cco_body .cc-photos li:nth-child(n+9) { display: none; }

/* ---------- 9. CONTENT COMPONENTS (used inside page HTML) ---------- */
/* Course / event info box */
html body.cco_body .cc-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px 28px; background: var(--cc-cream); border: 1px solid var(--cc-line); border-radius: var(--cc-radius); padding: 28px; margin: 32px 0; }
html body.cco_body .cc-info__label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--cc-accent-text); margin: 0 0 4px; }
html body.cco_body .cc-info__value { font-weight: 700; color: var(--cc-ink); font-size: 16px; line-height: 1.5; margin: 0; }
/* Numbered lessons */
html body.cco_body .cc-lessons { list-style: none; padding: 0 !important; margin: 24px 0; display: grid; gap: 14px; counter-reset: cc-lesson; }
html body.cco_body .cc-lessons li { counter-increment: cc-lesson; position: relative; padding: 20px 22px 20px 76px !important; border: 1px solid var(--cc-line); border-radius: var(--cc-radius-sm); background: var(--cc-white); list-style: none !important; margin: 0 !important; }
html body.cco_body .cc-lessons li::before { content: counter(cc-lesson, decimal-leading-zero); position: absolute; left: 22px; top: 18px; font-family: var(--cc-font-head) !important; font-weight: 400; font-size: 28px; color: var(--cc-accent); }
html body.cco_body .cc-lessons strong { display: block; font-family: var(--cc-font-head) !important; font-weight: 400; color: var(--cc-ink); font-size: 21px; margin-bottom: 4px; }
/* FAQ (uses a details element, works without JS) */
html body.cco_body .cc-faq details { border-bottom: 1px solid var(--cc-line); padding: 18px 0; }
html body.cco_body .cc-faq summary { cursor: pointer; font-family: var(--cc-font-head) !important; font-weight: 400; font-size: 22px; color: var(--cc-ink); list-style: none; }
html body.cco_body .cc-faq summary::-webkit-details-marker { display: none; }
html body.cco_body .cc-faq summary::after { content: "+"; float: right; color: var(--cc-accent-text); font-size: 24px; line-height: 1; }
html body.cco_body .cc-faq details[open] summary::after { content: "\2212"; }
html body.cco_body .cc-faq details p { margin: 12px 0 0; color: var(--cc-muted); }
/* Call-to-action panel */
html body.cco_body .cc-cta { background: var(--cc-ink); border-radius: var(--cc-radius); padding: 48px; color: var(--cc-on-dark); margin: 40px 0; }
html body.cco_body .cc-cta h2, html body.cco_body .cc-cta h3 { color: var(--cc-white) !important; margin-top: 0 !important; }
html body.cco_body .cc-cta p { color: var(--cc-on-dark-muted) !important; }
@media (max-width: 760px) { html body.cco_body .cc-cta { padding: 32px 24px; } }

/* Course shelf ("Past courses" page): each course is a textbook cover, grouped by year.
   theme.js builds it from a plain table on a ChabadOne page (Season | Course | Tagline | Topic | Video | Audio). */
html body.cco_body .cc-stats { display: flex; flex-wrap: wrap; gap: 12px 40px; margin: 28px 0 0; padding: 0; list-style: none; }
html body.cco_body .cc-stats li { display: flex; flex-direction: column; gap: 2px; }
html body.cco_body .cc-stats strong { font-family: var(--cc-font-head) !important; font-weight: 400; font-size: 44px; line-height: 1; color: var(--cc-ink); }
html body.cco_body .cc-stats span { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--cc-accent-text); }
html body.cco_body .cc-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 36px; }
html body.cco_body .cc-chips button {
  font: 600 14px var(--cc-font-body); padding: 9px 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--cc-line); background: var(--cc-white); color: var(--cc-text);
}
html body.cco_body .cc-chips button:hover { border-color: var(--cc-primary); }
html body.cco_body .cc-chips button[aria-pressed="true"] { background: var(--cc-ink); border-color: var(--cc-ink); color: var(--cc-white); }
html body.cco_body .cc-chips i { font-style: normal; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: 0; }
html body.cco_body .cc-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 20px; }
html body.cco_body .cc-shelf__year {
  display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; aspect-ratio: 3 / 4; max-width: 100%;
  padding: 0 4px 16px; box-sizing: border-box; border-bottom: 3px solid var(--cc-accent);
}
html body.cco_body .cc-shelf__year strong { font-family: var(--cc-font-head) !important; font-weight: 400; font-size: 52px; line-height: 1; color: var(--cc-ink); }
html body.cco_body .cc-shelf__year span { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cc-accent-text); }
html body.cco_body .cc-book {
  --book: var(--cc-ink);
  position: relative; display: flex; flex-direction: column; gap: 10px; aspect-ratio: 3 / 4; max-width: 100%;
  padding: 18px 16px 16px 24px; border-radius: 4px 8px 8px 4px; box-sizing: border-box;
  background: var(--book); color: var(--cc-on-dark); text-decoration: none !important;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .08) inset, 0 12px 28px rgba(47, 6, 25, .18);
  transition: transform .2s ease, box-shadow .2s ease;
}
html body.cco_body .cc-book::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: rgba(0, 0, 0, .22); box-shadow: 1px 0 0 rgba(255, 255, 255, .12); }
html body.cco_body .cc-book:hover { transform: translateY(-4px); box-shadow: 0 1px 0 rgba(255, 255, 255, .08) inset, 0 20px 40px rgba(47, 6, 25, .26); }
html body.cco_body .cc-book__season { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cc-accent-on-dark); }
html body.cco_body .cc-book__title { font-family: var(--cc-font-head) !important; font-weight: 400; font-size: 22px; line-height: 1.08; color: var(--cc-white); margin: 0; text-wrap: balance; overflow-wrap: anywhere; hyphens: auto; }
html body.cco_body .cc-book__tag { font-size: 13px; line-height: 1.45; color: var(--cc-on-dark-muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
html body.cco_body .cc-book__foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; }
html body.cco_body .cc-book__foot a, html body.cco_body .cc-book__foot span {
  font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 999px; text-decoration: none !important;
  background: rgba(255, 255, 255, .14); color: var(--cc-white) !important;
}
html body.cco_body .cc-book__foot a:hover { background: var(--cc-white); color: var(--cc-ink) !important; }
html body.cco_body .cc-book__open { all: unset; cursor: pointer; font: inherit; color: inherit; }
html body.cco_body .cc-book__open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
html body.cco_body .cc-book__open:focus-visible::after { outline: 3px solid var(--cc-focus); outline-offset: 2px; }
html body.cco_body .cc-book__foot { position: relative; z-index: 1; }
html body.cco_body .cc-dialog {
  width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 64px); box-sizing: border-box; overflow: auto;
  border: 0; border-radius: var(--cc-radius); padding: 40px 36px 36px; background: var(--cc-white); color: var(--cc-text);
  box-shadow: var(--cc-shadow-lg);
}
html body.cco_body .cc-dialog::backdrop { background: rgba(47, 6, 25, .55); }
html body.cco_body .cc-dialog .cc-h2 { font-size: clamp(28px, 4vw, 40px); }
html body.cco_body .cc-dialog .cc-lede { font-size: 17px; }
html body.cco_body .cc-dialog__x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--cc-cream); color: var(--cc-ink); font-size: 22px; cursor: pointer; }
html body.cco_body .cc-dialog__h { font-family: var(--cc-font-body) !important; font-size: 12px !important; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cc-accent-text); margin: 24px 0 8px; }
html body.cco_body .cc-dialog__lessons { margin: 0 0 24px; padding-left: 22px; line-height: 1.7; }
html body.cco_body .cc-book[hidden], html body.cco_body .cc-shelf__year[hidden] { display: none !important; }
html body.cco_body .cc-book--t1 { --book: var(--cc-book-1); }
html body.cco_body .cc-book--t2 { --book: var(--cc-book-2); }
html body.cco_body .cc-book--t3 { --book: var(--cc-book-3); }
html body.cco_body .cc-book--t4 { --book: var(--cc-book-4); }
html body.cco_body .cc-book--t5 { --book: var(--cc-book-5); }
@media (max-width: 640px) {
  html body.cco_body .cc-shelf { grid-template-columns: 1fr 1fr; gap: 12px; }
  html body.cco_body .cc-shelf__year { aspect-ratio: auto; grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; align-items: baseline; gap: 10px; padding: 12px 0 8px; }
  html body.cco_body .cc-shelf__year strong { font-size: 36px; }
  html body.cco_body .cc-book { padding: 14px 12px 12px 20px; aspect-ratio: auto; min-height: 150px; }
  html body.cco_body .cc-book__title { font-size: 19px; }
  html body.cco_body .cc-book__tag { display: none; }
  html body.cco_body .cc-stats strong { font-size: 34px; }
}

/* ---------- 10. REDUCED MOTION ---------- */
@media (prefers-reduced-motion: reduce) {
  html body.cco_body .cc-card, html body.cco_body .cc-btn, html body.cco_body .cc-program__img { transition: none !important; }
  html body.cco_body a.cc-card:hover, html body.cco_body .cc-btn:hover { transform: none !important; }
}

/* ==========================================================================
   11. EVENT REGISTRATION PAGE  (/tools/events/register.asp)
   Pure restyling of ChabadOne's reservation form. No markup or behavior is
   changed: every input, name and button stays exactly where ChabadOne put it.
   Scope: #RegisterSinglePage only.
   ========================================================================== */
html body.cco_body #RegisterSinglePage {
  background: transparent !important;
  border: 0 !important;
  padding: 0 !important;
  font-size: 16px;
  color: var(--cc-text);
  max-width: 920px;
  margin: 0 auto;
}
html body.cco_body #RegisterSinglePage,
html body.cco_body #RegisterSinglePage * { box-sizing: border-box; }

/* --- Event header: banner + description + "Event info" card --- */
html body.cco_body #RegisterHeader { display: grid; grid-template-columns: 1fr 300px; gap: 24px; margin-bottom: 24px; }
html body.cco_body #RegisterHeader .banner_image { grid-column: 1 / -1; margin: 0 !important; }
html body.cco_body #RegisterHeader .banner_image img { width: 100%; height: auto; display: block; border-radius: var(--cc-radius); }
html body.cco_body #RegisterHeader .column1,
html body.cco_body #RegisterHeader .column2 { float: none !important; width: auto !important; margin: 0 !important; }
html body.cco_body #RegisterHeader .column1 .event_name { display: none; } /* already the page title */
html body.cco_body #RegisterHeader .event_description { font-size: 18px; line-height: 1.7; color: var(--cc-text); }
html body.cco_body #RegisterHeader .column2 {
  background: var(--cc-cream); border: 1px solid var(--cc-line); border-radius: var(--cc-radius);
  padding: 22px 24px; align-self: start;
}
html body.cco_body #RegisterHeader .column2 .heading { font-family: var(--cc-font-body); font-size: 12px !important; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cc-accent-text); }
html body.cco_body #RegisterHeader .column2 .label { width: auto !important; float: none !important; font-size: 13px; color: var(--cc-muted); font-weight: 700; }
html body.cco_body #RegisterHeader .column2 a { color: var(--cc-ink) !important; font-weight: 700; text-decoration: none; }
html body.cco_body #RegisterHeader .column2 .float_left { float: none !important; }
@media (max-width: 760px) { html body.cco_body #RegisterHeader { grid-template-columns: 1fr; } }

/* --- Each step becomes a card --- */
html body.cco_body #RegisterBody #Performances,
html body.cco_body #RegisterBody #Summary,
html body.cco_body #RegisterBody #ReserversInformation,
html body.cco_body #RegisterBody #Payment,
html body.cco_body #RegisterBody #AdditionalInformation:has(*) {
  background: var(--cc-white);
  border: 1px solid var(--cc-line);
  border-radius: var(--cc-radius);
  padding: 28px 32px !important;
  margin: 0 0 20px !important;
}
html body.cco_body #RegisterBody .separator { border: 0 !important; background: none !important; }
html body.cco_body #RegisterBody .large_top_padding { padding-top: 0 !important; }
html body.cco_body #RegisterBody .title.large span.bold,
html body.cco_body #RegisterBody #Performances > .title span.bold {
  display: block;
  font-family: var(--cc-font-head) !important;
  font-weight: 400;
  font-size: 28px;
  color: var(--cc-ink);
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}
html body.cco_body #RegisterBody #Performances > .title { margin-top: 0 !important; padding-top: 0 !important; }
html body.cco_body #RegisterBody .regular { font-size: 15px; color: var(--cc-muted); }
html body.cco_body #Performances .performance { border: 0 !important; background: none !important; padding: 0 !important; }
html body.cco_body #Performances .performance > .title .event_name span.medium { display: block; color: var(--cc-muted); font-size: 14px; }

/* --- Inputs everywhere on the page --- */
html body.cco_body #RegisterSinglePage input:not([type="radio"]):not([type="checkbox"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="image"]):not([type="file"]),
html body.cco_body #RegisterSinglePage select,
html body.cco_body #RegisterSinglePage textarea {
  width: 100% !important;
  max-width: 100%;
  height: 48px;
  padding: 0 14px !important;
  border: 1px solid var(--cc-field-border) !important;
  border-radius: var(--cc-radius-sm) !important;
  background: var(--cc-white) !important;
  color: var(--cc-text) !important;
  font-size: 16px !important;   /* 16px stops iPhone from zooming in */
  font-family: var(--cc-font-body) !important;
  box-shadow: none !important;
  margin: 0 !important;
}
html body.cco_body #RegisterSinglePage textarea { height: 110px; padding: 12px 14px !important; line-height: 1.5; }
html body.cco_body #RegisterSinglePage input:focus,
html body.cco_body #RegisterSinglePage select:focus,
html body.cco_body #RegisterSinglePage textarea:focus {
  outline: 0 !important;
  border-color: var(--cc-primary) !important;
  box-shadow: 0 0 0 3px rgba(135, 26, 57, .18) !important;
}
html body.cco_body #RegisterSinglePage input[type="radio"],
html body.cco_body #RegisterSinglePage input[type="checkbox"] { accent-color: var(--cc-primary); width: 18px; height: 18px; margin: 0 10px 0 0 !important; flex: none; }

/* --- Add-reservation bar (category, quantity, Add) --- */
html body.cco_body #RegisterSinglePage .toggle_options { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px 0 !important; }
html body.cco_body #RegisterSinglePage .toggle_options[style*="none"] { display: none !important; }
html body.cco_body #RegisterSinglePage .toggle_options > .inline_block { flex: 1 1 180px; }
html body.cco_body #RegisterSinglePage .toggle_options > .inline_block > div:first-child { font-size: 13px; font-weight: 700; color: var(--cc-muted); margin-bottom: 6px !important; }
html body.cco_body #RegisterSinglePage .toggle_message {
  cursor: pointer; color: var(--cc-primary) !important; font-weight: 700; font-size: 16px;
  padding: 14px 18px !important; margin-top: 16px; border: 1.5px dashed var(--cc-field-border); border-radius: var(--cc-radius-sm);
  background: var(--cc-white); text-align: center;
}
html body.cco_body #RegisterSinglePage .toggle_message:hover { border-color: var(--cc-primary); background: var(--cc-tint); }
html body.cco_body #RegisterSinglePage .toggle_message i { margin-right: 8px !important; }
html body.cco_body #RegisterSinglePage .add_attendee:not(:disabled) { opacity: 1 !important; cursor: pointer; }
html body.cco_body #RegisterSinglePage .add_attendee:disabled { opacity: 1 !important; background: #9AA3B0 !important; cursor: not-allowed; transform: none !important; }
/* registration type shown as a chip on each attendee row */
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > .g100 {
  justify-self: start; line-height: 1.2 !important; padding: 6px 12px !important; margin-bottom: 9px !important;
  background: var(--cc-accent-soft); color: var(--cc-accent-text) !important; border-radius: var(--cc-radius-sm);
  font-size: 13px !important; font-weight: 700;
}

/* --- Reservation rows (attendee names) --- */
html body.cco_body #RegisterSinglePage .reservations > .clearfix:not(.reservation) { display: none; } /* old column headings; labels are added per row below */
html body.cco_body #RegisterSinglePage .reservation {
  border: 1px solid var(--cc-line); border-radius: var(--cc-radius-sm); padding: 18px !important; margin-top: 14px !important; background: var(--cc-cream);
}
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child {
  display: grid; gap: 12px; align-items: end; padding: 0 !important;
  grid-template-columns: 32px 1fr 1fr auto auto 36px;
  grid-template-areas: "idx fn ln cat price rm";
}
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > div { width: auto !important; float: none !important; margin: 0 !important; padding: 0 !important; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > [id$="_index"] { grid-area: idx; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > div:nth-child(2) { grid-area: fn; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > div:nth-child(3) { grid-area: ln; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > .g100 { grid-area: cat; color: var(--cc-muted); font-size: 14px; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > .price-display { grid-area: price; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > .g40 { grid-area: rm; }
html body.cco_body #RegisterSinglePage .reservation .seat_selection:empty { display: none; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > div:nth-child(2)::before,
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > div:nth-child(3)::before { display: block; font-size: 14px; font-weight: 600; color: var(--cc-ink); margin: 0 0 6px; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > div:nth-child(2)::before { content: "First name"; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > div:nth-child(3)::before { content: "Last name"; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child > .price-display { line-height: 48px; }
html body.cco_body #RegisterSinglePage .reservation [id$="_index"] {
  width: 32px !important; height: 32px; border-radius: 50%; background: var(--cc-primary); color: var(--cc-white);
  display: flex !important; align-items: center; justify-content: center; font-size: 14px;
  margin-bottom: 8px !important;
}
html body.cco_body #RegisterSinglePage .reservation .price-display { font-weight: 700; color: var(--cc-ink); white-space: nowrap; }
html body.cco_body #RegisterSinglePage .remove_reservation {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--cc-line); background: var(--cc-white); color: var(--cc-muted); cursor: pointer; font-size: 18px; line-height: 1; margin-bottom: 6px;
}
html body.cco_body #RegisterSinglePage .reservation input::placeholder { color: #8A8F98; }
@media (max-width: 640px) {
  html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child {
    grid-template-columns: 32px 1fr auto 36px;
    grid-template-areas: "idx fn fn rm" ". ln ln ." ". cat price .";
  }
}

/* --- Phone markup: ChabadOne serves a different row structure to phones (by user agent):
       [index] [type + price + remove] [names + questions]. Lay it out as: header bar, then full-width body. --- */
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) {
  grid-template-columns: 32px 1fr !important;
  grid-template-areas: "idx meta" "body body" !important;
  align-items: center !important; row-gap: 14px;
}
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) > [id$="_index"] { grid-area: idx; margin: 0 !important; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) > .float_right { grid-area: meta; display: flex !important; align-items: center; justify-content: flex-end; gap: 10px; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) > .float_right > .inline_block:first-child {
  margin-right: auto !important; padding: 6px 12px !important; background: var(--cc-accent-soft); color: var(--cc-accent-text);
  border-radius: var(--cc-radius-sm); font-size: 13px; font-weight: 700; line-height: 1.2;
}
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) > .float_right .remove_reservation { margin: 0 !important; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) > .clearfix.small_top_padding { grid-area: body; display: block !important; width: auto !important; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) > div:nth-child(2)::before, html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) > div:nth-child(3)::before { content: none !important; }
html body.cco_body #RegisterSinglePage .reservation > .clearfix:first-child:has(> .clearfix.small_top_padding) > .clearfix.small_top_padding > .inline_block { display: block !important; width: 100% !important; margin: 0 0 12px !important; padding: 0 !important; }

onship", "Divine Image Projection: Freeing and Implementing Our Potential"], "r": []}, {"t": "The Kabbalah of Meaning", "s": "Fall 2025", "d": "Jewish wisdom for finding the purpose that connects all parts of life: what meaning is, where it comes from, and how to find it in daily routines, relationships, the rhythms of the calendar, and the circumstances we did not choose.", "l": ["The Meaning We Seek", "To Make or Not to Make Meaning", "Meaning in the Mundane", "Meaning in the Rhythms of Time", "Meaning in the Unchosen", "I Mean Something, Therefore I Am"], "r": [{"t": "spotify", "u": "https://podcasters.spotify.com/pod/show/torah-deep-dive"}]}, {"t": "Heaven on Earth", "s": "Summer 2025", "d": "A virtual tour of our Holy Temple. Join us for a three-week virtual tour of the Holy Temple, the home we shared with G-d, because envisioning the Temple and longing for it are the first steps toward rebuilding it.", "l": [], "r": []}, {"t": "Colorful Profiles", "s": "Spring 2025", "d": "Short stories of extraordinary lives from Jewish history. A four-week journey to encounter twelve stories of Jewish history's most fascinating men and women: converts, captives, royal advisors, philosophers, philanthropists, and more.", "l": ["Courageous Converts", "Influential Jews", "Unsung Heroines", "Heroes and Hostages"], "r": []}, {"t": "Decoding the Talmud", "s": "Winter 2025", "d": "Inside the story, substance, and significance of the book that defines Judaism. Learn the key terms, logical principles, and historical context required to decode every part of the Talmudic page.", "l": ["The Jewish People and the Talmud", "The Mishnah", "Decrypting the Mishnah", "To Create the Talmud", "How the Talmud Thinks", "The Talmud until Today"], "r": []}, {"t": "A Work of Heart", "s": "Women's series 2024-25", "d": "Between Me and G-d: How Jewish prayer unites Heaven and Earth. A monthly lunch-and-learn series for women that flings the cover off the Jewish prayer book, the prayer services, and the synagogue.", "l": ["A Work of Soul: A New Paradigm for Prayer", "A Work of Pleas: Understanding the Mechanics of Petition", "A Work of Ascent: Making Sense of Liturgy, One Step at a Time", "A Work of Praise: Finding G-d in Our World", "A Work of Transcendence: Achieving True Transcendence in Prayer", "A Work of Synthesis: Synthesizing Divinity and Materiality in the Amidah", "A Work of Alliance: Finding Meaning in Communal Prayer"], "r": []}, {"t": "Nurturing Relationships", "s": "Fall 2024", "d": "Relationships don't just happen; they're nurtured. Jewish wisdom for building deeper, richer connection in all your relationships, at home, at work, and beyond.", "l": ["Empathy and deep friendships (Lesson 1)", "Attentive, active listening (Lesson 2)", "Direct communication on hard topics and handling conflict (Lesson 3)", "Seeing goodness in flawed people (Lesson 4)", "Offering critique and guidance with care (Lesson 5)", "Forgiveness and rebuilding relationships (Lesson 6)"], "r": []}, {"t": "Decisions of Fate", "s": "Summer 2024", "d": "Your Jewish compass for navigating questions of medical ethics. Explore the guiding Jewish values that help inform choices in four areas: experimental treatments, extending life, pregnancy questions, and caring for a body.", "l": ["Experimental Treatments", "Extending Life", "Pregnancy Questions", "A Body's Dignity"], "r": []}, {"t": "Read it in Hebrew", "s": "Winter 2024", "d": "A five-session Hebrew reading crash course, guaranteed to be effective in only five sessions, using interactive flashcards and its own app. For all levels, from beginners to those who want a refresher.", "l": [], "r": []}, {"t": "Advice for Life", "s": "Winter 2024", "d": "The Rebbe's advice for leading a more purposeful life. A multimedia journey through the Lubavitcher Rebbe's practical wisdom on work, family, health, and well-being.", "l": ["Meaning at Work", "Family Bliss", "Wholesome Health", "Healthy at Heart", "Above Adversity", "Spiritual Heights"], rrestrials through the Talmud, Jewish philosophy, and Kabbalah.", "l": ["Dreams & Direction", "Stars & Signs", "Jinx & The Evil Eye", "Para & Normal"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_N0cqormK__WFjIKOvGkY4N"}]}, {"t": "Book Smart", "s": "Winter 2023", "d": "A grand tour through the vast sea of Jewish wisdom and learning: a panoramic overview of 3000 years of Jewish learning, from Tanach and Midrash to Talmud, Halachah, philosophy, Kabbalah, Musar and Chasidism.", "l": ["The Torah", "The Midrash", "The Talmud", "Halachah", "Musar and Jewish Philosophy", "Kabbalah and Chasidism"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_N0cqormK__WFjIKOvGkY4N"}]}, {"t": "To Believe or Not to Believe in Yourself", "s": "Women's series 2022-23", "d": "How do we navigate our inner complexity and chart a clear path for ourselves? A monthly lunch-and-learn series for women, created and taught by women for women. (Second annual series.)", "l": ["Know Thyself. Know Thyself.", "Living on the Ledge of the In-Between", "The Long and Short of It. The Short and Long of It.", "Worst Case Scenario? Best Case Scenario?", "Do Happy. Be Happy!", "Wheeling and Dealing to Feeling the Healing", "If You Mind, It Matters"], "r": []}, {"t": "My G-d", "s": "Fall 2022", "d": "Nothing is off-limits as this refreshingly open course asks piercing questions about G-d: His nature, His purpose for creation, how we experience Him, and the role of religion, miracles and prayer.", "l": ["The Basics", "His Nature", "His Reasons", "His Expectations", "His Paradoxes", "Our Relationship"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_MEMu-AC-XWC_Ic10KIAhWl"}]}, {"t": "Survival of a Nation", "s": "Summer 2022", "d": "One fateful week in June 1967 redrew the map of the Middle East. A course on the Six-Day War and Israel today that confronts the impossible yet important questions our nation faces from a unique Jewish perspective.", "l": ["Jewish Homeland", "Anti-Israel Sentiment", "Preemptive Strikes", "Civilian Casualties", "Captured Territories", "Land for Peace"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_M0exftld1uCz-NXapOBYy0"}]}, {"t": "Beyond Right", "s": "Spring 2022", "d": "The values that shape Judaism's civil code. Beneath the Talmudic discussion and legalese lie the core Jewish values that fuel the debate; explore fascinating legal and ethical issues and uncover the values that make us who we are.", "l": ["Beyond Good Neighbors", "Beyond Restitution", "Beyond Taking Offense", "Beyond Personal Freedom", "Beyond Lawful Ownership", "Beyond Presumption of Innocence"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_NvVniVB6DdRRQGmPAPTIAn"}]}, {"t": "Meditation from Sinai", "s": "Winter 2022", "d": "The Torah was given at Sinai. So were the meditative tools to help us open up, see more, and live more deeply. Jewish teachings on mindful awareness, spirituality, and meditative practice for new and experienced meditators.", "l": ["Mind Control: I Think Therefore I Can", "Spiritual Awakening: Tune In, Play On", "Divine Animation: Joy Vey", "Here and Wow: Free Every Moment", "Club Med: Eat Better, Sleep Deeper, Work Higher", "Act Natural: Climb the Mountain Do"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_PV7RER45apVEJ08D7SITDW"}]}, {"t": "Well-Connected", "s": "Women's series 2021-22", "d": "Judaism is less a system of belief than a system of action. Well-Connected reveals the soul of Jewish ritual life by showing how to make each mitzvah personal, and a way to connect to something beyond ourselves. (A new monthly lunch-and-learn series for women.)", "l": ["Unroll the Scroll", "Soul Food", "Endlessly Blessed", "A Slice of Life", "Pray It Forward", "The Kinds of Kindness", "To Live in Deed"], "r": []}, {"t": "Outsmarting Antisemitism", "s": "Fall 2021", "d": "We cannot let antisemitism define our Judaism, but we cannot ignore it either. The course takes this dark subject on squarely, with illuminating source texts and captivating case studies, to fight hate with hope.", "l": ["The Eternal People", "No Apologies", "The Promised Land", "Change of Heart"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_NV2vzqY9uddLGQGQ4lue1d"}]}, {"t": "Judaism Decoded", "s": "Summer 2021", "d": "Judaism Decoded is a unique exploration of the inner workings of Judaism, shedding light on the logic behind Torah law and the Talmudic debate.", "l": ["The Dynamic Duo", "A Formula for Eternity", "Rabbis Making Rules", "Debating the Divine", "Laws that Expire", "Evidence for Sinai"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_PldVTMDU-gjfcicO4dD80H"}]}, {"t": "This Can Happen", "s": "Spring 2021", "d": "For thousands of years, the prophecies of a \u201cmessianic age\u201d stretched the imaginations of even the most fervent believers. Not anymore. A credible case for feeling good about the future.", "l": ["Start with the Science", "Who Needs a Redemption?", "Superhuman vs. Super Humans", "We're Getting There", "Out of the Blues", "And Then\u2026"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_Mrplg7dJW0resJH-m432Xq"}]}, {"t": "Journey of the Soul", "s": "Winter 2021", "d": "Who hasn't wondered what happens when we die? A fresh look at life, death and the rest\u2014in peace: the soul's journey before birth and after death.", "l": ["Demystifying Death", "Taking Leave", "The Mourning After", "Where We Go", "Where We Go Again", "Life Is Short(ish)"], "r": [{"t": "youtube", "u": "https://youtube.com/playlist?list=PLbHO_Q5DmD_OYo3Hi1VkTcC7NrH0q2ijY"}]}, {"t": "Secrets of the Bible", "s": "Fall 2020", "d": "Revisit six seemingly absurd biblical stories you likely remember from Hebrew school. Iconic stories, mystical meanings, and lessons for life.", "l": ["Would you choose knowledge over paradi olved into universal values.", "l": [], "r": [{"t": "wix-audio", "u": "https://www.bhchabad.org/giftsaudio"}]}, {"t": "Worrier to Warrior", "s": "Fall 2019", "d": "We yearn to feel happy, self-assured, and enthusiastic, yet we\u2019re consumed by feelings of doubt, regret and worry. Jewish secrets to feeling good however you feel: a six-week course blending Torah and psychology.", "l": [], "r": [{"t": "wix-audio", "u": "https://www.bhchabad.org/warrioraudio"}]}, {"t": "Paradigm Shift", "s": "Summer 2019", "d": "Paradigm Shift offers a revolutionary and empowering outlook on life, culled from the wisdom of the Lubavitcher Rebbe, marking his 25th yahrzeit: an elevator ride to the heights of what is possible.", "l": ["A Beautiful Garden", "Realizing Your Potential", "This Is Mission Control", "Follower or Leader", "The Upside of Failure", "Opening Our Eyes"], "r": [{"t": "wix-audio", "u": "https://www.bhchabad.org/shift-audio"}]}, {"t": "With All My Heart", "s": "Spring 2019", "d": "Discover the Jewish art of prayer and spirituality in our newest six-session course, whether you\u2019re seeking relief from stress or hoping for focus, clarity, and connection.", "l": [], "r": [{"t": "wix-audio", "u": "https://www.bhchabad.org/copy-of-the-jewish-course-of-why-au"}]}, {"t": "Crime and Consequence", "s": "Winter 2019", "d": "In Crime and Consequence, we explore 3000 years of Jewish law and wisdom concerning criminal convictions, sentencing, and rehabilitation.", "l": [], "r": [{"t": "wix-audio", "u": "https://www.bhchabad.org/crimeaudio"}]}, {"t": "Wrestling with Faith", "s": "Fall 2018", "d": "Where is the evidence for G-d? Tackling the biggest questions and challenges to faith, from Jewish practice to science and religion.", "l": [], "r": []}, {"t": "Heaven on Earth", "s": "Summer 2018", "d": "A three-week virtual tour of the Holy Temple, the home we shared with G-d. Discover the marvels of architecture and design that were integral to this sacred site.", "l": [], "r": []}, {"t": "What Is?", "s": "Spring 2018", "d": "Rethink everything you know about our universe. Jewish mysticism on the building blocks of existence and the human condition.", "l": [], "r": [{"t": "wix-audio", "u": "https://www.bhchabad.org/whatisaudio"}]}, {"t": "Communication: Its Art and Soul", "s": "Winter 2018", "d": "In the era of social media, the value of healthy communication among family members and associates is widely recognized. Reclaim the lost art of human connection.", "l": [], "r": []}, {"t": "Great Debates in Jewish History", "s": "Fall 2017", "d": "Debate and disputation are not only encouraged within Judaism but reside at the very heart of Jewish history and theology. Six of the biggest debates that rocked the Jewish world, then and today.", "l": ["Rabbis and the Divine Word", "To Be or Not To Be", "Reason and Religion", "Forcing Redemption", "The To-Do About Chassidism", "The Commercialization of Religion"], "r": []}];<\/script>

<script>
  (function () {
    var src = document.getElementById('site-src').textContent.replace(/<\\\/script/g, '</script');
    var frame = document.getElementById('site');
    frame.srcdoc = src;
    var stage = document.getElementById('stage');

      bP.setAttribute('aria-pressed', String(phone));
    }
    var pR = document.getElementById('pal-refined'), pO = document.getElementById('pal-original'), original = false;

    bD.addEventListener('click', function () { set(false); });
    bP.addEventListener('click', function () { set(true); });

</script>
